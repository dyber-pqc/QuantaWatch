[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantawatch"
version = "0.1.0"
description = "Python SDK for QuantaWatch — AI agent security gateway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "QuantaWatch Team" },
]
keywords = ["ai", "security", "gateway", "agent", "llm", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/dyber-pqc/QuantaWatch"
Documentation = "https://github.com/dyber-pqc/QuantaWatch#readme"
Repository = "https://github.com/dyber-pqc/QuantaWatch.git"
Issues = "https://github.com/dyber-pqc/QuantaWatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["quantawatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
