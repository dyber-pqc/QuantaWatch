{{- /* No PVC when the gateway is stateless (shared store + shared seed). */}}
{{- if and .Values.persistence.enabled (not (include "quantawatch.stateless" .)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quantawatch.fullname" . }}-data
  labels:
    {{- include "quantawatch.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
