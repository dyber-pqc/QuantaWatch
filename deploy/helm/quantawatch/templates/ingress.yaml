{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quantawatch.fullname" . }}
  labels:
    {{- include "quantawatch.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Admin API on the gateway (dashboard calls /api/*)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "quantawatch.fullname" . }}
                port:
                  name: admin
          {{- if .Values.dashboard.enabled }}
          # Everything else -> dashboard SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quantawatch.fullname" . }}-dashboard
                port:
                  name: http
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quantawatch.fullname" . }}
                port:
                  name: admin
          {{- end }}
{{- end }}
