{{- /* Guardrails: horizontal scale needs a shared store + a shared identity. */}}
{{- if gt (int .Values.replicaCount) 1 }}
  {{- if not (include "quantawatch.sharedStore" .) }}
    {{- fail "replicaCount > 1 requires a shared store — set fortressql.enabled=true (recommended) or point store.path at a postgres:// URL. A per-pod SQLite file cannot be shared." }}
  {{- end }}
  {{- if not (include "quantawatch.hasSeed" .) }}
    {{- fail "replicaCount > 1 requires a shared signing identity — set secretEnv.QW_GATEWAY_SEED to a hex-encoded 32-byte seed (openssl rand -hex 32), so every replica signs as the same gateway." }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantawatch.fullname" . }}
  labels:
    {{- include "quantawatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if include "quantawatch.stateless" . }}
    type: RollingUpdate     # stateless (shared store + seed): rolling is safe
    {{- else }}
    type: Recreate          # local state on an RWO PVC: avoid multi-attach
    {{- end }}
  selector:
    matchLabels:
      {{- include "quantawatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
      labels:
        {{- include "quantawatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "quantawatch.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["/app/quantawatch.yaml"]
          env:
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
            # Unique, stable-per-lifetime audit writer id so each replica owns
            # its own hash-chain in the shared, sharded audit log.
            - name: QW_AUDIT_WRITER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.fortressql.enabled }}
            # DB password from the FortressQL Secret; referenced by $(...) in
            # QW_STORE_PATH below (so it never lands in the ConfigMap).
            - name: FORTRESSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantawatch.fortressqlName" . }}
                  key: password
            {{- end }}
            # Store location, expanded from the config's ${QW_STORE_PATH}.
            - name: QW_STORE_PATH
              value: {{ include "quantawatch.storePath" . | quote }}
          {{- if .Values.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "quantawatch.fullname" . }}-secrets
          {{- end }}
          ports:
            - name: proxy
              containerPort: {{ .Values.gateway.proxyPort }}
            - name: admin
              containerPort: {{ .Values.gateway.adminPort }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/quantawatch.yaml
              subPath: quantawatch.yaml
              readOnly: true
            {{- if and .Values.persistence.enabled (not (include "quantawatch.stateless" .)) }}
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/keys
              subPath: keys
            - name: data
              mountPath: /app/audit
              subPath: audit
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quantawatch.fullname" . }}-config
        {{- if and .Values.persistence.enabled (not (include "quantawatch.stateless" .)) }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "quantawatch.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "quantawatch.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
