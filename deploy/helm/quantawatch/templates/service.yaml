apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantawatch.fullname" . }}
  labels:
    {{- include "quantawatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quantawatch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: proxy
      port: {{ .Values.gateway.proxyPort }}
      targetPort: proxy
    - name: admin
      port: {{ .Values.gateway.adminPort }}
      targetPort: admin
{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantawatch.fullname" . }}-dashboard
  labels:
    {{- include "quantawatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quantawatch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
{{- end }}
