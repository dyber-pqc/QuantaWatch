# QuantaWatch Helm values
# ---------------------------------------------------------------------------
# Every secret is supplied via env vars referenced (by NAME) from the gateway
# config. Put the actual values in `secretEnv` below (rendered into a k8s
# Secret) — never in the ConfigMap.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/dyber-pqc/quantawatch
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
pullSecrets: []

replicaCount: 1       # SQLite-backed: keep at 1 unless using an external DB

# --- Gateway process -------------------------------------------------------
gateway:
  proxyPort: 9090     # in-path LLM proxy
  adminPort: 9091     # admin API + dashboard
  logLevel: info
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# --- Persistence (SQLite store + ML-DSA keys + audit log) ------------------
persistence:
  enabled: true
  storageClass: ""    # "" = cluster default
  size: 10Gi
  accessMode: ReadWriteOnce
  # Mounted at /app/data (SQLite), /app/keys (identity), /app/audit (log chain)

# --- Dashboard (static SPA served by nginx) --------------------------------
dashboard:
  enabled: true
  image:
    repository: ghcr.io/dyber-pqc/quantawatch-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# --- Secrets (rendered into a Kubernetes Secret, exposed as env vars) ------
# Keys here become env var NAMES the quantawatch.yaml references via
# `*_env` fields (api_key_env, webhook_secret_env, oidc client_secret_env…).
secretEnv:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  QW_WEBHOOK_SECRET: ""
  GITHUB_TOKEN: ""
  # The gateway's ML-DSA signing identity as a hex-encoded 32-byte seed
  # (`openssl rand -hex 32`), referenced from config via `identity.seed_env`.
  # Set this to keep the identity — and therefore the audit chain and CBOM
  # attestation — stable across pod restarts and rescheduling. Required before
  # any multi-replica deployment so all replicas sign as the same gateway.
  # QW_GATEWAY_SEED: ""
  # GITHUB_WEBHOOK_SECRET: ""   # per-integration inbound secret
  # OIDC_CLIENT_SECRET: ""
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, AZURE_*, GCP_* as needed

# The full quantawatch.yaml. Rendered verbatim into a ConfigMap and mounted
# at /app/quantawatch.yaml. Override with `--set-file config=path/to.yaml`
# or an inline block in your own values file.
#
# Schema matches quantawatch.yaml.example: `gateway.*`, `providers` as a MAP
# keyed by id, and stores pointed at the persistent volume mounts
# (/app/data, /app/keys, /app/audit). All secrets are referenced by env-var
# NAME (supplied via secretEnv above), never inline.
config: |
  gateway:
    listen: "0.0.0.0:9090"
    admin_listen: "0.0.0.0:9091"
  providers:
    anthropic:
      upstream: "https://api.anthropic.com"
      protocol: anthropic
      api_key_env: ANTHROPIC_API_KEY
    openai:
      upstream: "https://api.openai.com"
      protocol: openai
      api_key_env: OPENAI_API_KEY
  identity:
    session_ttl: 3600
    key_dir: "/app/keys"
  audit:
    path: "/app/audit"
    merkle_batch_size: 64
  policy:
    default: deny
  scanner:
    store_path: "/app/data"
    auto_scan_on_start: true
  auth:
    enabled: true
    webhook_secret_env: QW_WEBHOOK_SECRET

service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: quantawatch.example.com
  tls:
    enabled: true
    secretName: quantawatch-tls
  # "/"     -> dashboard (admin UI)
  # "/api"  -> gateway admin API (adminPort)

podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
