name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hoist a signing-secret marker to env: the `secrets` context is not allowed
    # in `if:` conditions, but `env` is. Steps test `env.ES_USERNAME` to decide
    # whether SSL.com eSigner (cloud) code-signing is configured.
    env:
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: quantawatch-linux
          - os: macos-latest
            artifact-name: quantawatch-macos
          - os: windows-latest
            artifact-name: quantawatch-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Pinned toolchain (matches rust-toolchain.toml) for reproducible builds.
      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # --locked: build exactly the committed Cargo.lock, so deps can't drift.
      - name: Build release binaries (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p qw-gateway -p qw-cli

      # On Windows we additionally ship the native desktop app (egui).
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p qw-gateway -p qw-cli -p qw-desktop

      # Authenticode-sign the desktop exe *before* packaging so the MSI/Inno
      # installers embed a signed binary. SSL.com EV certs live on a cloud HSM
      # (no exportable .pfx), so we sign via eSigner. Runs only when the eSigner
      # secrets are present; a signing hiccup is non-fatal (unsigned still ships).
      - name: Sign desktop executable (SSL.com eSigner)
        if: ${{ runner.os == 'Windows' && env.ES_USERNAME != '' }}
        continue-on-error: true
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/release/quantawatch-desktop.exe
          override: true
          malware_block: false
          environment_name: PROD

      # Package the desktop app as an MSI (cargo-wix + WiX v3). Non-blocking: if
      # WiX tooling misbehaves the release still ships the raw signed exe.
      - name: Install WiX + cargo-wix (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          cargo install cargo-wix --version "^0.3" --locked

      - name: Build MSI installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo wix --package qw-desktop --no-build --nocapture `
            --output target\wix\quantawatch-desktop.msi

      # Also build a friendly setup.exe (Inno Setup) - a "proper" interactive
      # installer alternative to the MSI. Non-blocking like the MSI.
      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/Otarget\inno" `
            crates\qw-desktop\installer\quantawatch-desktop.iss

      # Authenticode-sign the installers via eSigner (one file per step). Each is
      # non-fatal so a skipped MSI/Inno build (or a signing hiccup) doesn't fail
      # the release. eSigner errors if the file is absent — continue-on-error
      # absorbs that when packaging was skipped.
      - name: Sign MSI (SSL.com eSigner)
        if: ${{ runner.os == 'Windows' && env.ES_USERNAME != '' }}
        continue-on-error: true
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/wix/quantawatch-desktop.msi
          override: true
          malware_block: false
          environment_name: PROD

      - name: Sign Inno setup.exe (SSL.com eSigner)
        if: ${{ runner.os == 'Windows' && env.ES_USERNAME != '' }}
        continue-on-error: true
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/inno/quantawatch-desktop-setup.exe
          override: true
          malware_block: false
          environment_name: PROD

      - name: Warn if eSigner signing is not configured
        if: ${{ runner.os == 'Windows' && env.ES_USERNAME == '' }}
        run: echo "::warning::ES_USERNAME not set - shipping an UNSIGNED desktop exe + MSI + setup.exe. Configure SSL.com eSigner secrets. See docs/RELEASES.md."

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            target/release/quantawatch
            target/release/qw

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          # if-no-files-found: ignore so a missing MSI (packaging skipped) doesn't
          # fail the upload; the exes are always present.
          if-no-files-found: warn
          name: ${{ matrix.artifact-name }}
          path: |
            target/release/quantawatch.exe
            target/release/qw.exe
            target/release/quantawatch-desktop.exe
            target/wix/quantawatch-desktop.msi
            target/inno/quantawatch-desktop-setup.exe

  docker:
    name: Docker Build & Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    # Needs attestations:write for build-provenance and id-token:write for the
    # keyless cosign signature; the top-level grant lacks attestations, so the
    # provenance step failed with "Resource not accessible by integration".
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - component: gateway
            image: ghcr.io/dyber-pqc/quantawatch
            dockerfile: Dockerfile
          - component: dashboard
            image: ghcr.io/dyber-pqc/quantawatch-dashboard
            dockerfile: Dockerfile.dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless Sigstore signature over the pushed image digest. Verify with:
      #   cosign verify ${{ matrix.image }}@<digest> \
      #     --certificate-identity-regexp 'https://github.com/dyber-pqc/QuantaWatch/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      # SLSA build provenance for the image (tamper-evident supply-chain record).
      # Non-blocking: GitHub attestations aren't available on user-owned PRIVATE
      # repos ("Feature not available..."). The image is still keyless-signed
      # above. This starts working automatically if the repo goes public/org.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Assemble checksums, sign them (post-quantum + Sigstore), and cut the release.
  release:
    name: Checksums & signed release
    runs-on: ubuntu-latest
    needs: build-binaries
    # `secrets` is not allowed in `if:`; hoist to env so steps can test env.
    env:
      QW_RELEASE_SEED: ${{ secrets.QW_RELEASE_SEED }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          # Only the per-OS binary bundles - not the .dockerbuild record the
          # docker job uploads (its ~-laden name broke the "download all").
          pattern: quantawatch-*
          path: artifacts

      - name: Assemble release files + SHA256SUMS
        run: |
          mkdir -p dist
          # Flatten per-OS artifacts into dist/, prefixing by platform. Recurse:
          # the Windows bundle nests files under release/wix/inno subdirs (upload
          # rooted them at target/), so a top-level glob would drop every Windows
          # artifact - exe, MSI and setup.exe.
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            find "$d" -type f | while read -r f; do
              cp "$f" "dist/${plat}-$(basename "$f")"
            done
          done
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Post-quantum signature over the checksums, using QuantaWatch's own CLI
      # and ML-DSA-65 — the same signature scheme the product is built on.
      # Anyone verifies with the published public key:
      #   qw verify-file SHA256SUMS --signature SHA256SUMS.sig \
      #                  --public-key docs/release-signing-key.pub
      - name: Build the signer (qw)
        run: cargo build --release --locked -p qw-cli
      - name: Post-quantum sign the checksums (ML-DSA-65)
        if: ${{ env.QW_RELEASE_SEED != '' }}
        run: |
          ./target/release/qw sign dist/SHA256SUMS \
            --seed-env QW_RELEASE_SEED \
            --output dist/SHA256SUMS.sig
      - name: Warn if the PQC signing key is not configured
        if: ${{ env.QW_RELEASE_SEED == '' }}
        run: echo "::warning::QW_RELEASE_SEED not set — skipping post-quantum signature. See docs/RELEASES.md."

      # Sigstore keyless signature over the checksums (what most consumers check).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sigstore sign the checksums
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.cosign.sig --output-certificate dist/SHA256SUMS.cosign.pem dist/SHA256SUMS

      # Non-blocking: attestations are unavailable on user-owned private repos.
      - name: Attest build provenance for the binaries
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/release-signing-key.pub
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-binaries
    environment:
      name: pypi
      url: https://pypi.org/p/quantawatch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build
        working-directory: sdk/python

      # Trusted Publishing (OIDC) — no stored token. Requires a Trusted Publisher
      # configured on PyPI: owner dyber-pqc, repo QuantaWatch, workflow
      # release.yml, environment "pypi". The job inherits the top-level
      # `id-token: write`, and PEP 740 attestations are produced automatically.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          # 0.1.0 may already be published (a prior run succeeded here); skip
          # rather than fail so re-tagged runs stay green.
          skip-existing: true
