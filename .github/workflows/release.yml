name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hoist signing secrets to env: the `secrets` context is not allowed in `if:`
    # conditions, but `env` is. Steps test `env.WINDOWS_CERT_PFX`.
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: quantawatch-linux
          - os: macos-latest
            artifact-name: quantawatch-macos
          - os: windows-latest
            artifact-name: quantawatch-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned toolchain (matches rust-toolchain.toml) for reproducible builds.
      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # --locked: build exactly the committed Cargo.lock, so deps can't drift.
      - name: Build release binaries (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p qw-gateway -p qw-cli

      # On Windows we additionally ship the native desktop app (egui).
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p qw-gateway -p qw-cli -p qw-desktop

      # Authenticode-sign the desktop exe *before* packaging so the MSI carries a
      # signed binary. Runs only when the signing cert secret is present; a
      # signing hiccup is non-fatal (an unsigned exe still ships, with a warning).
      - name: Sign desktop executable (Windows)
        if: ${{ runner.os == 'Windows' && env.WINDOWS_CERT_PFX != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 target\release\quantawatch-desktop.exe
          Remove-Item $pfx

      # Package the desktop app as an MSI (cargo-wix + WiX v3). Non-blocking: if
      # WiX tooling misbehaves the release still ships the raw signed exe.
      - name: Install WiX + cargo-wix (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          cargo install cargo-wix --version "^0.3" --locked

      - name: Build MSI installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo wix --package qw-desktop --no-build --nocapture `
            --output target\wix\quantawatch-desktop.msi

      # Also build a friendly setup.exe (Inno Setup) - a "proper" interactive
      # installer alternative to the MSI. Non-blocking like the MSI.
      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/Otarget\inno" `
            crates\qw-desktop\installer\quantawatch-desktop.iss

      # Authenticode-sign both installers (whichever exist) when the cert is set.
      - name: Sign installers (Windows)
        if: ${{ runner.os == 'Windows' && env.WINDOWS_CERT_PFX != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($f in @('target\wix\quantawatch-desktop.msi', 'target\inno\quantawatch-desktop-setup.exe')) {
            if (Test-Path $f) {
              & $st.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 $f
            }
          }
          Remove-Item $pfx

      - name: Warn if Windows signing cert is not configured
        if: ${{ runner.os == 'Windows' && env.WINDOWS_CERT_PFX == '' }}
        run: echo "::warning::WINDOWS_CERT_PFX not set - shipping an UNSIGNED desktop exe + MSI. See docs/RELEASES.md."

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            target/release/quantawatch
            target/release/qw

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          # if-no-files-found: ignore so a missing MSI (packaging skipped) doesn't
          # fail the upload; the exes are always present.
          if-no-files-found: warn
          name: ${{ matrix.artifact-name }}
          path: |
            target/release/quantawatch.exe
            target/release/qw.exe
            target/release/quantawatch-desktop.exe
            target/wix/quantawatch-desktop.msi
            target/inno/quantawatch-desktop-setup.exe

  docker:
    name: Docker Build & Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: gateway
            image: ghcr.io/dyber-pqc/quantawatch
            dockerfile: Dockerfile
          - component: dashboard
            image: ghcr.io/dyber-pqc/quantawatch-dashboard
            dockerfile: Dockerfile.dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless Sigstore signature over the pushed image digest. Verify with:
      #   cosign verify ${{ matrix.image }}@<digest> \
      #     --certificate-identity-regexp 'https://github.com/dyber-pqc/QuantaWatch/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      # SLSA build provenance for the image (tamper-evident supply-chain record).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Assemble checksums, sign them (post-quantum + Sigstore), and cut the release.
  release:
    name: Checksums & signed release
    runs-on: ubuntu-latest
    needs: build-binaries
    # `secrets` is not allowed in `if:`; hoist to env so steps can test env.
    env:
      QW_RELEASE_SEED: ${{ secrets.QW_RELEASE_SEED }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files + SHA256SUMS
        run: |
          mkdir -p dist
          # Flatten per-OS artifacts into dist/, prefixing by platform.
          for d in artifacts/*/; do
            plat="$(basename "$d")"
            for f in "$d"*; do
              base="$(basename "$f")"
              cp "$f" "dist/${plat}-${base}"
            done
          done
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Post-quantum signature over the checksums, using QuantaWatch's own CLI
      # and ML-DSA-65 — the same signature scheme the product is built on.
      # Anyone verifies with the published public key:
      #   qw verify-file SHA256SUMS --signature SHA256SUMS.sig \
      #                  --public-key docs/release-signing-key.pub
      - name: Build the signer (qw)
        run: cargo build --release --locked -p qw-cli
      - name: Post-quantum sign the checksums (ML-DSA-65)
        if: ${{ env.QW_RELEASE_SEED != '' }}
        run: |
          ./target/release/qw sign dist/SHA256SUMS \
            --seed-env QW_RELEASE_SEED \
            --output dist/SHA256SUMS.sig
      - name: Warn if the PQC signing key is not configured
        if: ${{ env.QW_RELEASE_SEED == '' }}
        run: echo "::warning::QW_RELEASE_SEED not set — skipping post-quantum signature. See docs/RELEASES.md."

      # Sigstore keyless signature over the checksums (what most consumers check).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sigstore sign the checksums
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.cosign.sig --output-certificate dist/SHA256SUMS.cosign.pem dist/SHA256SUMS

      - name: Attest build provenance for the binaries
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            docs/release-signing-key.pub
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-binaries
    environment:
      name: pypi
      url: https://pypi.org/p/quantawatch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build
        working-directory: sdk/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
