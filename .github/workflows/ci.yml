name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  ml-feature:
    name: ML detector feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-ml-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ml-
            ${{ runner.os }}-cargo-

      # The optional semantic-detection backend (candle) is off by default, so
      # the main job never compiles it. Build + test it here so it can't rot,
      # including the real-model inference test in qw-monitor.
      - name: Clippy (ml feature)
        run: cargo clippy -p qw-monitor -p qw-gateway --features ml -- -D warnings

      - name: Test (ml feature)
        run: cargo test -p qw-monitor --features ml

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The desktop runs ML-DSA-65 keygen/signing on the eframe main thread; the
      # Windows main-thread stack default (~1 MiB) is too small, which crashed
      # certificate issue with STATUS_STACK_OVERFLOW. Linux CI can't catch it, so
      # build + test the whole workspace on Windows here...
      - name: Build and test workspace (Windows)
        run: cargo test --workspace

      # ...and run the desktop's headless self-check, which issues a hybrid cert
      # on the *main* thread. If the stack reserve in qw-desktop/build.rs is ever
      # lost, this exits non-zero (overflow) instead of shipping the regression.
      - name: Desktop main-thread crypto self-check
        run: cargo run -q -p qw-desktop -- --selfcheck

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: sdk/python

      - name: Run tests
        run: pytest
        working-directory: sdk/python

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build
        working-directory: sdk/typescript

      - name: Run tests
        run: npm test
        working-directory: sdk/typescript

  self-cbom:
    name: Self-CBOM drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Regenerate QuantaWatch's own CBOM and fail if it differs from the
      # committed one. The artifact is byte-reproducible (--deterministic), so
      # any diff means our own cryptographic inventory changed and the published
      # copy — which we ask people to trust — went stale.
      - name: Regenerate self-CBOM
        run: |
          cargo run -q -p qw-cli -- cbom export . \
            --deps-only --recursive --deterministic \
            -o docs/quantawatch.cbom.json

      - name: Fail if the published CBOM is stale
        run: |
          if ! git diff --exit-code -- docs/quantawatch.cbom.json; then
            echo "::error::QuantaWatch's own CBOM changed but docs/quantawatch.cbom.json was not updated."
            echo "Regenerate it and commit:"
            echo "  cargo run -p qw-cli -- cbom export . --deps-only --recursive --deterministic -o docs/quantawatch.cbom.json"
            exit 1
          fi
          echo "Self-CBOM is current."

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/quantawatch

      - name: Render templates (default + ingress)
        run: |
          helm template quantawatch deploy/helm/quantawatch > /dev/null
          helm template quantawatch deploy/helm/quantawatch \
            --set ingress.enabled=true --set ingress.host=quantawatch.example.com > /dev/null
