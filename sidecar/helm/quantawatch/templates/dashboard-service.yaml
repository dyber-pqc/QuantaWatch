{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantawatch.fullname" . }}-dashboard
  labels:
    {{- include "quantawatch.dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "quantawatch.dashboard.selectorLabels" . | nindent 4 }}
{{- end }}
