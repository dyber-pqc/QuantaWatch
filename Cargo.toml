[workspace]
resolver = "2"
members = [
    "crates/qw-crypto",
    "crates/qw-policy",
    "crates/qw-monitor",
    "crates/qw-audit",
    "crates/qw-scanner",
    "crates/qw-cbom",
    "crates/qw-integrations",
    "crates/qw-store",
    "crates/qw-gateway",
    "crates/qw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dyber-pqc/QuantaWatch"

[workspace.dependencies]
# PQC (pure Rust, no CMake needed)
ml-dsa = "0.1.0-rc.7"
ml-kem = "0.3.0-rc.0"

# Crypto
sha3 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand = "0.9"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Regex
regex = "1"

# Async trait
async-trait = "0.1"

# Concurrent map
dashmap = "6"

# Signature trait
signature = "3.0.0-rc.10"
