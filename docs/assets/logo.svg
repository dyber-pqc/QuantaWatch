  <circle cx="60" cy="52" r="3" fill="#e0e7ff"/>
  <circle cx="48" cy="62" r="2.5" fill="#e0e7ff"/>
  <circle cx="72" cy="62" r="2.5" fill="#e0e7ff"/>
  <circle cx="52" cy="74" r="2.5" fill="#e0e7ff"/>
  <circle cx="68" cy="74" r="2.5" fill="#e0e7ff"/>
  <circle cx="60" cy="84" r="2" fill="#e0e7ff"/>
  <!-- Lattice connections -->
  <line x1="60" y1="52" x2="48" y2="62" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="52" x2="72" y2="62" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="48" y1="62" x2="52" y2="74" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="72" y1="62" x2="68" y2="74" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="48" y1="62" x2="68" y2="74" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="72" y1="62" x2="52" y2="74" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="52" y1="74" x2="60" y2="84" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="68" y1="74" x2="60" y2="84" stroke="#e0e7ff" stroke-width="1.5" opacity="0.7"/>
