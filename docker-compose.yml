version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"   # Proxy port
      - "9091:9091"   # Admin API port
    volumes:
      - ./quantawatch.yaml.example:/app/quantawatch.yaml:ro
      - audit-data:/app/audit
      - key-data:/app/keys
    environment:
      - RUST_LOG=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  audit-data:
  key-data:
